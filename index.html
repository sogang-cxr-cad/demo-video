<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CXR-CAD 시연 영상</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #090d16;
            --container-bg: rgba(15, 23, 42, 0.45);
            --card-bg: rgba(30, 41, 59, 0.3);
            --card-border: rgba(255, 255, 255, 0.05);
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 10% 100%, rgba(129, 140, 248, 0.04) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        header {
            text-align: center;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 span.emoji {
            font-size: 2.2rem;
        }

        /* Flow steps layout */
        .flow-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 8px;
            position: relative;
        }

        @media (max-width: 1024px) {
            .flow-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
            .flow-step::after {
                display: none !important;
            }
        }

        @media (max-width: 640px) {
            .flow-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        .flow-step {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .flow-step:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 12px 20px -8px var(--accent-glow);
            background: rgba(30, 41, 59, 0.5);
        }

        .flow-step::after {
            content: "→";
            position: absolute;
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(148, 163, 184, 0.4);
            font-size: 1.1rem;
            z-index: 10;
            transition: color 0.3s;
        }

        .flow-step:last-child::after {
            display: none;
        }

        @media (max-width: 768px) {
            .flow-step::after {
                content: "↓";
                right: 50%;
                bottom: -16px;
                top: auto;
                transform: translateX(50%);
            }
        }

        .flow-step:hover::after {
            color: var(--accent-primary);
        }

        .step-num {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .step-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            word-break: keep-all;
        }

        /* Video container styling */
        .video-container {
            width: 100%;
            background: var(--container-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 12px;
            box-shadow:
                0 30px 60px -15px rgba(0, 0, 0, 0.8),
                0 0 50px -10px rgba(56, 189, 248, 0.03);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease-out;
        }

        .video-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.25), rgba(129, 140, 248, 0.25), transparent);
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #020617;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.5);
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Keyframes */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1><span class="emoji">🩺</span> CXR-CAD 통합 시연 영상</h1>
        </header>

        <!-- 시연 단계 흐름도 -->
        <div class="flow-container">
            <div class="flow-step">
                <span class="step-num">Step 01</span>
                <span class="step-title">이미지 업로드</span>
            </div>
            <div class="flow-step">
                <span class="step-num">Step 02</span>
                <span class="step-title">AI 추론</span>
            </div>
            <div class="flow-step">
                <span class="step-num">Step 03</span>
                <span class="step-title">결과 시각화</span>
            </div>
            <div class="flow-step">
                <span class="step-num">Step 04</span>
                <span class="step-title">Grad-CAM & 판독문 생성</span>
            </div>
            <div class="flow-step">
                <span class="step-num">Step 05</span>
                <span class="step-title">에이전트 Q&A</span>
            </div>
            <div class="flow-step">
                <span class="step-num">Step 06</span>
                <span class="step-title">임상 배치 신뢰성 평가</span>
            </div>
        </div>

        <!-- 비디오 플레이어 -->
        <div class="video-container">
            <div class="video-wrapper">
                <video controls autoplay muted>
                    <source src="demo.mp4" type="video/mp4">
                    브라우저가 동영상을 지원하지 않습니다.
                </video>
            </div>
        </div>
    </div>

</body>

</html>
